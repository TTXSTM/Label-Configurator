<script>
/* ── PDF download button ──────────────────────────────────────────────────── */
(function () {
  'use strict';

  function getJsPDF() { return window.jspdf && window.jspdf.jsPDF; }

  /* Inject "Скачать PDF" button next to the reset button */
  function injectPdfButton() {
    if (document.querySelector('[data-testid="button-download-pdf"]')) return;
    var resetBtn = Array.from(document.querySelectorAll('button')).find(function (b) {
      return b.textContent.trim().includes('Сбросить настройки макета');
    });
    if (!resetBtn) return;

    /* Create a fresh button — don't cloneNode to avoid copying event listeners */
    var pdfBtn = document.createElement('button');
    pdfBtn.setAttribute('data-testid', 'button-download-pdf');
    pdfBtn.type = 'button';
    pdfBtn.className = resetBtn.className;
    pdfBtn.innerHTML =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"' +
      ' stroke="currentColor" stroke-width="2" stroke-linecap="round"' +
      ' stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"' +
      ' aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
      '<polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
      '<span>Скачать PDF</span>';
    pdfBtn.style.cssText += ';display:inline-flex;align-items:center;gap:6px;';
    pdfBtn.addEventListener('click', generatePDF);
    resetBtn.parentNode.insertBefore(pdfBtn, resetBtn.nextSibling);
  }

  var pdfObserver = new MutationObserver(injectPdfButton);
  pdfObserver.observe(document.body, { childList: true, subtree: true });

  /* PDF generation */
  function generatePDF() {
    if (!getJsPDF())         { alert('jsPDF не загружен');       return; }
    if (!window.html2canvas) { alert('html2canvas не загружен'); return; }

    var printEl = document.getElementById('print-root');
    if (!printEl) { alert('Элемент print-root не найден'); return; }

    /* Physical label size — supports ×, x, X, кириллические х/Х */
    var physW = 58, physH = 40;
    var m = document.body.innerText.match(
      /Физический размер[:\s]+(\d+)\s*[×xXхХ\u00D7]\s*(\d+)\s*мм/i
    );
    if (m) { physW = +m[1]; physH = +m[2]; }

    var naturalW = parseFloat(printEl.style.width)  || printEl.scrollWidth;
    var naturalH = parseFloat(printEl.style.height) || printEl.scrollHeight;

    var wrapper = document.createElement('div');
    wrapper.style.cssText = [
      'position:fixed', 'left:-99999px', 'top:0',
      'width:'  + naturalW + 'px',
      'height:' + naturalH + 'px',
      'overflow:visible', 'background:#fff', 'z-index:-1'
    ].join(';');

    var clone = printEl.cloneNode(true);
    clone.style.cssText = [
      'position:relative', 'left:0', 'top:0',
      'width:'  + naturalW + 'px',
      'height:' + naturalH + 'px',
      'transform:none', 'transform-origin:top left',
      'overflow:visible', 'box-shadow:none', 'border:none',
      'border-radius:0', 'background:#fff',
      'font-family:Inter,system-ui,-apple-system,sans-serif'
    ].join(';');

    var sz = clone.querySelector('.label-safezone');
    if (sz) sz.style.display = 'none';

    clone.querySelectorAll('*').forEach(function (el) {
      var cs = getComputedStyle(el);
      if (cs.overflow === 'hidden' || cs.overflowX === 'hidden' || cs.overflowY === 'hidden') {
        el.style.overflow = 'visible';
      }
      if (cs.webkitLineClamp && cs.webkitLineClamp !== 'none') {
        el.style.webkitLineClamp = 'unset';
        el.style.display = 'block';
      }
    });

    wrapper.appendChild(clone);
    document.body.appendChild(wrapper);

    html2canvas(clone, {
      scale: 6, useCORS: true, allowTaint: true,
      backgroundColor: '#ffffff', logging: false,
      width: naturalW, height: naturalH, x: 0, y: 0
    }).then(function (canvas) {
      document.body.removeChild(wrapper);
      var imgData = canvas.toDataURL('image/png');
      var doc = new (getJsPDF())({
        orientation: physW >= physH ? 'landscape' : 'portrait',
        unit: 'mm',
        format: [physW, physH]
      });
      doc.addImage(imgData, 'PNG', 0, 0, physW, physH);
      doc.save('label.pdf');
    }).catch(function (err) {
      document.body.removeChild(wrapper);
      console.error(err);
      alert('Ошибка PDF: ' + err.message);
    });
  }
}());
</script>

<script>
/* ── Extra CSS-variable sliders (font size + code offsets) ────────────────── */
(function () {
  'use strict';

  var injected = false;

  /* Default values — used for reset */
  var DEFAULTS = {
    '--codes-offset-x':   0,
    '--barcode-offset-x': 0,
    '--qr-offset-x':      0,
    '--title-font-scale': 1,
    '--meta-font-scale':  1,
    '--store-font-scale': 1
  };

  /* Inject CSS overrides once */
  var style = document.createElement('style');
  style.id = 'label-overrides';
  style.textContent =
    ':root{' +
      '--codes-offset-x:0px;--barcode-offset-x:0px;--qr-offset-x:0px;' +
      '--title-font-scale:1;--meta-font-scale:1;--store-font-scale:1' +
    '}' +
    '[data-testid="preview-code-stack"]{transform:translateX(var(--codes-offset-x)) !important}' +
    '[data-testid="preview-code-stack"]>*:first-child{transform:translateX(var(--barcode-offset-x)) !important}' +
    '[data-testid="preview-code-stack"]>*:last-child{transform:translateX(var(--qr-offset-x)) !important}' +
    '[data-testid="preview-title"]{font-size:calc(1em * var(--title-font-scale)) !important}' +
    '[data-testid="preview-inventory"],[data-testid="preview-serial"]{font-size:calc(1em * var(--meta-font-scale)) !important}' +
    '[data-testid="preview-store"]{font-size:calc(1em * var(--store-font-scale)) !important}';
  document.head.appendChild(style);

  /* Track all slider inputs for reset */
  var sliderRegistry = [];

  /* Reset CSS vars + slider positions on "Сбросить" or size-button click */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var txt = btn.textContent.trim();
    var isReset = txt.includes('Сбросить настройки макета');
    var isSize  = (btn.getAttribute('data-testid') || '').startsWith('button-size-');
    if (!isReset && !isSize) return;

    Object.keys(DEFAULTS).forEach(function (v) {
      var val = DEFAULTS[v];
      document.documentElement.style.setProperty(v, val + (v.includes('offset') ? 'px' : ''));
    });
    sliderRegistry.forEach(function (s) {
      s.input.value = s.def;
      s.span.textContent = s.def + s.suffix;
    });
  }, true);

  /* Build a single slider row */
  function makeSlider(label, cssVar, min, max, step, def, suffix) {
    var wrap = document.createElement('div');

    var hdr = document.createElement('div');
    hdr.className = 'flex items-center justify-between mb-2';

    var lbl = document.createElement('label');
    lbl.className = 'text-xs text-muted-foreground';
    lbl.textContent = label;

    var span = document.createElement('span');
    span.className = 'text-[11px] font-mono text-foreground tabular-nums';
    span.textContent = def + suffix;

    hdr.appendChild(lbl);
    hdr.appendChild(span);

    var input = document.createElement('input');
    input.type  = 'range';
    input.min   = min;
    input.max   = max;
    input.step  = step;
    input.value = def;
    input.style.cssText = 'width:100%;accent-color:hsl(var(--primary,174 100% 22%));cursor:pointer;';

    input.addEventListener('input', function () {
      var v = parseFloat(this.value);
      span.textContent = v + suffix;
      document.documentElement.style.setProperty(cssVar, v + (suffix === 'px' ? 'px' : ''));
    });

    sliderRegistry.push({ input: input, span: span, def: def, suffix: suffix, cssVar: cssVar });

    var ftr = document.createElement('div');
    ftr.className = 'flex items-center justify-between mt-1 text-[10px] text-muted-foreground';
    ftr.innerHTML = '<span>' + min + '</span><span>' + max + '</span>';

    wrap.appendChild(hdr);
    wrap.appendChild(input);
    wrap.appendChild(ftr);
    return wrap;
  }

  /* Find the safe-margin slider row and inject after it */
  function injectSliders() {
    if (injected) return;

    var safeSlider = document.querySelector('[data-testid="slider-safe-margin"]');
    if (!safeSlider) return;

    /* Walk up to the direct child of the space-y container */
    var anchor = safeSlider;
    for (var i = 0; i < 6; i++) {
      if (!anchor.parentElement) return;
      var parentClass = anchor.parentElement.getAttribute('class') || '';
      if (parentClass.indexOf('space-y') !== -1) break;
      anchor = anchor.parentElement;
    }
    if (!anchor || !anchor.parentElement) return;

    var container = anchor.parentElement;
    /* Insert before the safe-zone toggle (next sibling of anchor) */
    var insertBefore = anchor.nextSibling;

    var sliders = [
      makeSlider('Сдвиг кодов X',    '--codes-offset-x',   -100, 100, 1,    0,    'px'),
      makeSlider('Сдвиг штрихкода',  '--barcode-offset-x',  -80,  80, 1,    0,    'px'),
      makeSlider('Сдвиг QR кода',    '--qr-offset-x',       -80,  80, 1,    0,    'px'),
      makeSlider('Размер заголовка', '--title-font-scale',  0.2,   2, 0.05, 1,    '×'),
      makeSlider('Размер инв/S/N',   '--meta-font-scale',   0.2,   2, 0.05, 1,    '×'),
      makeSlider('Размер магазина',  '--store-font-scale',  0.2,   2, 0.05, 1,    '×')
    ];

    sliders.forEach(function (s) {
      container.insertBefore(s, insertBefore);
    });

    injected = true;
    obs.disconnect(); /* no longer needed */
  }

  var obs = new MutationObserver(injectSliders);
  obs.observe(document.body, { childList: true, subtree: true });
}());
</script>
