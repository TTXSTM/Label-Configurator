<script>
/* ── PDF download button ──────────────────────────────────────────────────── */
(function () {
  'use strict';

  function getJsPDF() { return window.jspdf && window.jspdf.jsPDF; }

  /* Intercept the React save-config click to inject our CSS-var fields.
     We monkey-patch URL.createObjectURL once — when React calls it with a
     Blob that looks like a label config JSON we enrich it before download. */
  var _origCreateObjectURL = URL.createObjectURL.bind(URL);
  URL.createObjectURL = function (blob) {
    if (blob && blob.type === 'application/json') {
      try {
        var reader = new FileReaderSync ? new FileReaderSync() : null;
        /* FileReaderSync is only available in Workers; use a sync XHR trick
           instead — we replace the blob synchronously via a data URL. */
        var url = _origCreateObjectURL(blob);
        /* Async enrichment: fetch the blob, patch it, re-trigger download */
        blob.text().then(function (text) {
          try {
            var cfg = JSON.parse(text);
            /* Inject our CSS-variable values */
            var root = document.documentElement;
            cfg.lcCodesOffsetX   = parseFloat(root.style.getPropertyValue('--codes-offset-x'))   || 0;
            cfg.lcBarcodeOffsetX = parseFloat(root.style.getPropertyValue('--barcode-offset-x')) || 0;
            cfg.lcQrOffsetX      = parseFloat(root.style.getPropertyValue('--qr-offset-x'))      || 0;
            cfg.lcTitleScale     = parseFloat(root.style.getPropertyValue('--title-font-scale'))  || 1;
            cfg.lcMetaScale      = parseFloat(root.style.getPropertyValue('--meta-font-scale'))   || 1;
            cfg.lcStoreScale     = parseFloat(root.style.getPropertyValue('--store-font-scale'))  || 1;

            var enriched = new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' });
            var enrichedUrl = _origCreateObjectURL(enriched);

            /* Find the <a> that React just clicked and re-click with new URL */
            var a = document.querySelector('a[download*="label-config"]');
            if (a) {
              a.href = enrichedUrl;
              a.click();
              setTimeout(function () { URL.revokeObjectURL(enrichedUrl); }, 1000);
            }
          } catch (e) { /* ignore parse errors */ }
        });
        return url;
      } catch (e) { /* fall through */ }
    }
    return _origCreateObjectURL(blob);
  };

  /* Intercept file load: after React parses the JSON, apply our fields */
  document.addEventListener('change', function (e) {
    var input = e.target;
    if (!input || input.getAttribute('data-testid') !== 'input-load-config') return;
    var file = input.files && input.files[0];
    if (!file) return;
    file.text().then(function (text) {
      try {
        var cfg = JSON.parse(text);
        /* Apply our CSS-variable fields if present */
        if (typeof cfg.lcCodesOffsetX   === 'number') window.__lcApplyVar('--codes-offset-x',   cfg.lcCodesOffsetX,   'px');
        if (typeof cfg.lcBarcodeOffsetX === 'number') window.__lcApplyVar('--barcode-offset-x', cfg.lcBarcodeOffsetX, 'px');
        if (typeof cfg.lcQrOffsetX      === 'number') window.__lcApplyVar('--qr-offset-x',      cfg.lcQrOffsetX,      'px');
        if (typeof cfg.lcTitleScale     === 'number') window.__lcApplyVar('--title-font-scale',  cfg.lcTitleScale,     '');
        if (typeof cfg.lcMetaScale      === 'number') window.__lcApplyVar('--meta-font-scale',   cfg.lcMetaScale,      '');
        if (typeof cfg.lcStoreScale     === 'number') window.__lcApplyVar('--store-font-scale',  cfg.lcStoreScale,     '');
      } catch (e) { /* ignore */ }
    });
  }, true);

  /* Inject "Скачать PDF" button next to the reset button */
  function injectPdfButton() {
    if (document.querySelector('[data-testid="button-download-pdf"]')) return;
    var resetBtn = Array.from(document.querySelectorAll('button')).find(function (b) {
      return b.textContent.trim().includes('Сбросить настройки макета');
    });
    if (!resetBtn) return;

    var pdfBtn = document.createElement('button');
    pdfBtn.setAttribute('data-testid', 'button-download-pdf');
    pdfBtn.type = 'button';
    pdfBtn.className = resetBtn.className;
    pdfBtn.innerHTML =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"' +
      ' stroke="currentColor" stroke-width="2" stroke-linecap="round"' +
      ' stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"' +
      ' aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
      '<polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
      '<span>Скачать PDF</span>';
    pdfBtn.style.cssText += ';display:inline-flex;align-items:center;gap:6px;';
    pdfBtn.addEventListener('click', generatePDF);
    resetBtn.parentNode.insertBefore(pdfBtn, resetBtn.nextSibling);
  }

  var pdfObserver = new MutationObserver(injectPdfButton);
  pdfObserver.observe(document.body, { childList: true, subtree: true });

  /* PDF generation */
  function generatePDF() {
    if (!getJsPDF())         { alert('jsPDF не загружен');       return; }
    if (!window.html2canvas) { alert('html2canvas не загружен'); return; }

    var printEl = document.getElementById('print-root');
    if (!printEl) { alert('Элемент print-root не найден'); return; }

    var physW = 58, physH = 40;
    var m = document.body.innerText.match(
      /Физический размер[:\s]+(\d+)\s*[×xXхХ\u00D7]\s*(\d+)\s*мм/i
    );
    if (m) { physW = +m[1]; physH = +m[2]; }

    var naturalW = parseFloat(printEl.style.width)  || printEl.scrollWidth;
    var naturalH = parseFloat(printEl.style.height) || printEl.scrollHeight;

    var wrapper = document.createElement('div');
    wrapper.style.cssText = [
      'position:fixed', 'left:-99999px', 'top:0',
      'width:'  + naturalW + 'px', 'height:' + naturalH + 'px',
      'overflow:visible', 'background:#fff', 'z-index:-1'
    ].join(';');

    var clone = printEl.cloneNode(true);
    clone.style.cssText = [
      'position:relative', 'left:0', 'top:0',
      'width:'  + naturalW + 'px', 'height:' + naturalH + 'px',
      'transform:none', 'transform-origin:top left',
      'overflow:visible', 'box-shadow:none', 'border:none',
      'border-radius:0', 'background:#fff',
      'font-family:Inter,system-ui,-apple-system,sans-serif'
    ].join(';');

    var sz = clone.querySelector('.label-safezone');
    if (sz) sz.style.display = 'none';

    clone.querySelectorAll('*').forEach(function (el) {
      var cs = getComputedStyle(el);
      if (cs.overflow === 'hidden' || cs.overflowX === 'hidden' || cs.overflowY === 'hidden')
        el.style.overflow = 'visible';
      if (cs.webkitLineClamp && cs.webkitLineClamp !== 'none') {
        el.style.webkitLineClamp = 'unset';
        el.style.display = 'block';
      }
    });

    wrapper.appendChild(clone);
    document.body.appendChild(wrapper);

    html2canvas(clone, {
      scale: 6, useCORS: true, allowTaint: true,
      backgroundColor: '#ffffff', logging: false,
      width: naturalW, height: naturalH, x: 0, y: 0
    }).then(function (canvas) {
      document.body.removeChild(wrapper);
      var imgData = canvas.toDataURL('image/png');
      var doc = new (getJsPDF())({
        orientation: physW >= physH ? 'landscape' : 'portrait',
        unit: 'mm', format: [physW, physH]
      });
      doc.addImage(imgData, 'PNG', 0, 0, physW, physH);
      doc.save('label.pdf');
    }).catch(function (err) {
      document.body.removeChild(wrapper);
      console.error(err);
      alert('Ошибка PDF: ' + err.message);
    });
  }
}());
</script>

<script>
/* ── Extra CSS-variable sliders (font size + code offsets) ────────────────── */
(function () {
  'use strict';

  var injected = false;

  /* Per-size presets for the CSS-variable sliders.
     Keys match data-testid="button-size-{id}" */
  var SIZE_PRESETS = {
    '58x40': {
      '--codes-offset-x':   0,
      '--barcode-offset-x': 13,
      '--qr-offset-x':      -20,
      '--title-font-scale': 0.60,
      '--meta-font-scale':  0.60,
      '--store-font-scale': 0.60
    },
    '32x25': {
      '--codes-offset-x':   0,
      '--barcode-offset-x': 7,
      '--qr-offset-x':      -9,
      '--title-font-scale': 0.35,
      '--meta-font-scale':  0.25,
      '--store-font-scale': 0.40
    },
    '58x60': {
      '--codes-offset-x':   0,
      '--barcode-offset-x': 0,
      '--qr-offset-x':      0,
      '--title-font-scale': 0.85,
      '--meta-font-scale':  0.65,
      '--store-font-scale': 0.60
    }
  };

  /* Default (used for sizes without a preset: 100x150, 102x76) */
  var DEFAULTS = {
    '--codes-offset-x':   0,
    '--barcode-offset-x': 0,
    '--qr-offset-x':      0,
    '--title-font-scale': 1,
    '--meta-font-scale':  1,
    '--store-font-scale': 1
  };

  /* Currently active preset values (start with defaults) */
  var activePreset = DEFAULTS;

  /* Track the active size id */
  var activeSizeId = null;

  /* CSS overrides */
  var style = document.createElement('style');
  style.id = 'label-overrides';
  style.textContent =
    ':root{--codes-offset-x:0px;--barcode-offset-x:0px;--qr-offset-x:0px;' +
    '--title-font-scale:1;--meta-font-scale:1;--store-font-scale:1}' +
    '[data-testid="preview-code-stack"]{transform:translateX(var(--codes-offset-x)) !important}' +
    '[data-testid="preview-code-stack"]>*:first-child{transform:translateX(var(--barcode-offset-x)) !important}' +
    '[data-testid="preview-code-stack"]>*:last-child{transform:translateX(var(--qr-offset-x)) !important}' +
    '[data-testid="preview-title"]{font-size:calc(1em * var(--title-font-scale)) !important}' +
    '[data-testid="preview-inventory"],[data-testid="preview-serial"]{font-size:calc(1em * var(--meta-font-scale)) !important}' +
    '[data-testid="preview-store"]{font-size:calc(1em * var(--store-font-scale)) !important}' +
    /* Make the custom range thumb match Radix UI thumb exactly */
    '.lc-slider{position:relative;display:flex;width:100%;touch-action:none;user-select:none;align-items:center;cursor:pointer}' +
    '.lc-track{position:relative;height:0.5rem;width:100%;flex-grow:1;overflow:hidden;border-radius:9999px;background-color:hsl(var(--secondary))}' +
    '.lc-range{position:absolute;height:100%;background-color:hsl(var(--primary))}' +
    '.lc-thumb{display:block;height:1.25rem;width:1.25rem;border-radius:9999px;border:2px solid hsl(var(--primary));background-color:hsl(var(--background));box-shadow:0 0 0 0 transparent;transition:box-shadow .15s;flex-shrink:0}' +
    '.lc-thumb:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring))}';
  document.head.appendChild(style);

  var sliderRegistry = [];

  /* Public helper used by the config-load interceptor above */
  window.__lcApplyVar = function (cssVar, value, unit) {
    document.documentElement.style.setProperty(cssVar, value + unit);
    sliderRegistry.forEach(function (s) {
      if (s.cssVar === cssVar) s.setVal(value);
    });
  };

  /* Apply a preset object to all CSS vars and registered sliders */
  function applyPreset(preset) {
    activePreset = preset;
    Object.keys(preset).forEach(function (v) {
      var val = preset[v];
      document.documentElement.style.setProperty(v, val + (v.includes('offset') ? 'px' : ''));
    });
    sliderRegistry.forEach(function (s) {
      if (s.cssVar in preset) s.setVal(preset[s.cssVar]);
    });
  }

  /* Reset on "Сбросить" or size-button click */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var testId  = btn.getAttribute('data-testid') || '';
    var isReset = btn.textContent.trim().includes('Сбросить настройки макета');
    var isSize  = testId.startsWith('button-size-');

    if (isSize) {
      var sizeId  = testId.replace('button-size-', '');
      activeSizeId = sizeId;
      /* Apply after a tick so React has updated its own state first */
      setTimeout(function () {
        applyPreset(SIZE_PRESETS[sizeId] || DEFAULTS);
      }, 50);
      return;
    }

    if (isReset) {
      applyPreset(SIZE_PRESETS[activeSizeId] || DEFAULTS);
    }
  }, true);

  /* Build a slider that looks identical to the Radix UI sliders above it */
  function makeSlider(label, cssVar, min, max, step, def, suffix) {
    var wrap = document.createElement('div');

    /* Header: label + value */
    var hdr = document.createElement('div');
    hdr.className = 'flex items-center justify-between mb-2';

    var lbl = document.createElement('label');
    lbl.className = 'text-xs text-muted-foreground';
    lbl.textContent = label;

    var valSpan = document.createElement('span');
    valSpan.className = 'text-[11px] font-mono text-foreground tabular-nums';

    function fmt(v) {
      /* Match Radix display: 1 decimal for мм, 2 for × and px */
      return (suffix === ' мм' ? parseFloat(v).toFixed(1) : parseFloat(v).toFixed(2)) + suffix;
    }
    valSpan.textContent = fmt(def);

    hdr.appendChild(lbl);
    hdr.appendChild(valSpan);

    /* Slider track + thumb — same DOM structure as Radix */
    var sliderEl = document.createElement('div');
    sliderEl.className = 'lc-slider';
    sliderEl.setAttribute('role', 'slider');
    sliderEl.setAttribute('aria-valuemin', min);
    sliderEl.setAttribute('aria-valuemax', max);
    sliderEl.setAttribute('aria-valuenow', def);
    sliderEl.tabIndex = 0;

    var track = document.createElement('div');
    track.className = 'lc-track';

    var range = document.createElement('div');
    range.className = 'lc-range';

    var thumb = document.createElement('div');
    thumb.className = 'lc-thumb';

    track.appendChild(range);
    sliderEl.appendChild(track);
    sliderEl.appendChild(thumb);

    var current = def;

    function setVal(v) {
      v = Math.min(max, Math.max(min, v));
      /* Snap to step */
      v = Math.round((v - min) / step) * step + min;
      v = parseFloat(v.toFixed(10));
      current = v;
      var pct = (v - min) / (max - min) * 100;
      range.style.width = pct + '%';
      /* Centre thumb on the fill end */
      thumb.style.position = 'absolute';
      thumb.style.left = 'calc(' + pct + '% - 10px)';
      valSpan.textContent = fmt(v);
      sliderEl.setAttribute('aria-valuenow', v);
      document.documentElement.style.setProperty(cssVar, v + (suffix === 'px' ? 'px' : ''));
    }

    setVal(def); /* initialise */

    /* Mouse / touch drag */
    function onMove(clientX) {
      var rect = track.getBoundingClientRect();
      var pct  = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      setVal(min + pct * (max - min));
    }

    sliderEl.addEventListener('mousedown', function (e) {
      e.preventDefault();
      onMove(e.clientX);
      function mm(e2) { onMove(e2.clientX); }
      function mu()   { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); }
      document.addEventListener('mousemove', mm);
      document.addEventListener('mouseup',   mu);
    });

    sliderEl.addEventListener('touchstart', function (e) {
      onMove(e.touches[0].clientX);
      function tm(e2) { onMove(e2.touches[0].clientX); }
      function te()   { sliderEl.removeEventListener('touchmove', tm); sliderEl.removeEventListener('touchend', te); }
      sliderEl.addEventListener('touchmove', tm, { passive: true });
      sliderEl.addEventListener('touchend',  te);
    }, { passive: true });

    /* Keyboard */
    sliderEl.addEventListener('keydown', function (e) {
      var d = { ArrowRight: step, ArrowUp: step, ArrowLeft: -step, ArrowDown: -step,
                Home: min - current, End: max - current };
      if (d[e.key] !== undefined) { e.preventDefault(); setVal(current + d[e.key]); }
    });

    /* Footer: min / max labels */
    var ftr = document.createElement('div');
    ftr.className = 'flex items-center justify-between mt-1 text-[10px] text-muted-foreground font-mono';
    ftr.innerHTML = '<span>' + min + '</span><span>' + max + '</span>';

    wrap.appendChild(hdr);
    wrap.appendChild(sliderEl);
    wrap.appendChild(ftr);

    sliderRegistry.push({ reset: function () { setVal(def); }, setVal: setVal, cssVar: cssVar });
    return wrap;
  }

  /* Inject after the safe-margin slider row */
  function injectSliders() {
    if (injected) return;

    var safeSlider = document.querySelector('[data-testid="slider-safe-margin"]');
    if (!safeSlider) return;

    var anchor = safeSlider;
    for (var i = 0; i < 8; i++) {
      if (!anchor.parentElement) return;
      if ((anchor.parentElement.getAttribute('class') || '').indexOf('space-y') !== -1) break;
      anchor = anchor.parentElement;
    }
    if (!anchor || !anchor.parentElement) return;

    var container    = anchor.parentElement;
    var insertBefore = anchor.nextSibling;

    [
      makeSlider('Сдвиг кодов X',    '--codes-offset-x',   -100, 100, 1,    0, 'px'),
      makeSlider('Сдвиг штрихкода',  '--barcode-offset-x',  -80,  80, 1,    0, 'px'),
      makeSlider('Сдвиг QR кода',    '--qr-offset-x',       -80,  80, 1,    0, 'px'),
      makeSlider('Размер заголовка', '--title-font-scale',  0.2,    2, 0.05, 1, '×'),
      makeSlider('Размер инв/S/N',   '--meta-font-scale',   0.2,    2, 0.05, 1, '×'),
      makeSlider('Размер магазина',  '--store-font-scale',  0.2,    2, 0.05, 1, '×')
    ].forEach(function (s) { container.insertBefore(s, insertBefore); });

    /* Detect which size is currently active and apply its preset */
    var activeBtn = document.querySelector('[data-testid^="button-size-"][class*="border-primary"]');
    if (activeBtn) {
      activeSizeId = activeBtn.getAttribute('data-testid').replace('button-size-', '');
      if (SIZE_PRESETS[activeSizeId]) applyPreset(SIZE_PRESETS[activeSizeId]);
    }

    injected = true;
    obs.disconnect();
  }

  var obs = new MutationObserver(injectSliders);
  obs.observe(document.body, { childList: true, subtree: true });
}());
</script>
